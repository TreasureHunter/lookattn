[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lookattn"
version = "0.1.0"
description = "Learned lookahead visual-token scoring for Qwen2.5-VL, on top of HAWK head-importance pruning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers==4.52.0",
  "tokenizers==0.21.1",
  "huggingface-hub==0.31.4",
  "qwen-vl-utils==0.0.11",
  "accelerate==1.4.0",
  "Pillow>=9.4",
]

[project.optional-dependencies]
eval = [
  "datasets==3.6.0",
  "ms-vlmeval==0.0.18",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "xlsxwriter>=3.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
